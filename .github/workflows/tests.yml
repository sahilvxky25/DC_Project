name: Progress and unit tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: node --test tests/*.test.mjs
